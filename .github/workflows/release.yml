name: release

# CD only runs on an explicit release cut: publishing a release (which carries
# its version tag) fires this. A PR merge or a plain branch push produces no
# binaries; a bare `git tag` push does not trigger it either.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Show release being built
        run: echo "building turnpike $VERSION (tag ${{ github.event.release.tag_name }})"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-xwin
      - run: rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc

      # macOS aarch64 — cross-compiled with Zig as the linker. turnpike is a
      # pure-Rust crate (rustls, no native-tls / security-framework), so no
      # Darwin frameworks are linked and SDKROOT is not needed. If a future
      # dependency does link frameworks, download the SDK and export SDKROOT
      # (see rust-cross/cargo-zigbuild's CI):
      #   curl -sqL https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz | tar -Jx -C .
      #   export SDKROOT=$PWD/MacOSX11.3.sdk
      - name: Cross-build macOS aarch64
        run: cargo zigbuild --release --locked --target aarch64-apple-darwin
      - name: Package macOS tar.gz
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/turnpike dist/turnpike
          tar -czf dist/turnpike-aarch64-apple-darwin.tar.gz -C dist turnpike

      # Windows amd64 — cargo-xwin fetches the MSVC CRT/SDK itself.
      - name: Cross-build Windows x64
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc
      - name: Package Windows zip
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/turnpike.exe dist/turnpike.exe
          (cd dist && zip -9 turnpike-x86_64-pc-windows-msvc.zip turnpike.exe)

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum turnpike-aarch64-apple-darwin.tar.gz \
                    turnpike-x86_64-pc-windows-msvc.zip > SHA256SUMS

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
