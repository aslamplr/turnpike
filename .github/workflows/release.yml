name: release

# CD only runs on an explicit release cut: publishing a release (which carries
# its version tag) fires this. A PR merge or a plain branch push produces no
# binaries; a bare `git tag` push does not trigger it either.
#
# One workflow, two layers. The CLI jobs cross-build both platforms from
# ubuntu-latest (cargo-zigbuild, cargo-xwin). The desktop jobs build natively on
# macos-latest and windows-latest — a macOS bundle can only be assembled on
# macOS, where `hdiutil` makes the dmg and the host's `codesign` signs the .app.
# Each desktop job needs the *matching platform's* CLI job and downloads that
# job's binary as an artifact, so the app ships the CLI it supervises and the
# two cannot drift.
#
# Within the CLI layer the two platforms are separate jobs on purpose. They run
# in parallel and each uploads its own asset as soon as it is built, so one
# platform failing no longer costs the other its release — on the v0.1.0 run the
# single-job version died in `Cross-build Windows x64` and the already-built,
# already-packaged macOS tarball was discarded with it. The desktop layer sits
# behind the CLI one for the same reason a step further out: every CLI job
# uploads its binary before any desktop job starts, so a broken Tauri build
# costs the CLI nothing. Both manifests run afterwards regardless
# (`if: always()`), derived from whatever actually got attached.
#
# The desktop layer also produces the auto-updater's inputs. `createUpdaterArtifacts`
# makes each bundle step emit a minisign `.sig` next to the artifact it signed —
# `turnpike.app.tar.gz` on macOS, the NSIS `-setup.exe` on Windows — and
# `desktop-sums` assembles those into `latest.json`, the manifest an installed app
# polls. So the update manifest is derived from the assets the release actually
# carries, never hand-written, and it is signed by the same key the app verifies
# against (`plugins.updater.pubkey` in tauri.conf.json).
#
# That key is therefore *required*, not optional. With `createUpdaterArtifacts` on,
# tauri-bundler exits 1 when `TAURI_SIGNING_PRIVATE_KEY` is unset — and it does so
# *after* writing the bundles, so the failure costs the whole desktop job rather
# than just the signature. A release with no secret therefore has no desktop assets
# at all; `desktop-sums` still runs (`if: always()`) and its `latest.json` step is
# what reports the absence.
on:
  release:
    types: [published]
  # Recovery hatch: publishing a release fires the `release` event exactly once,
  # and "re-run jobs" on an old run replays that run's old workflow file. To
  # (re)build the artifacts of an existing release, dispatch against its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to build and upload artifacts for
        required: true

permissions:
  contents: write

jobs:
  cli-macos:
    name: CLI macOS aarch64
    runs-on: ubuntu-latest
    env:
      # A release event carries the tag; a manual dispatch is given one.
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      # Build the tagged source, not the branch tip: a release event checks out
      # the tag's commit anyway, but a dispatch would otherwise build whatever
      # ref was picked in the UI, and the artifacts would not match the release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-darwin
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # turnpike is NOT a pure-Rust crate: rustls pulls in ring, whose C and
      # perlasm assembly are compiled through the CC path on every build (ring's
      # build script runs under CC_aarch64_apple_darwin = zig cc, and the ios64
      # objects land in libring_core_0_17_14_.a). No SDKROOT is needed because
      # Zig bundles the macOS libc headers and a libSystem.tbd stub
      # (lib/zig/libc/include/any-macos-any, lib/zig/libc/darwin/), and ring
      # links no Darwin frameworks.
      #
      # Depending on the cargo-zigbuild version installed, one warning may show
      # up here: it probes for an Apple SDK (`xcrun --sdk macosx --show-sdk-path`
      # — no such command on a Linux runner) and reports that it cannot find
      # MacOSX.sdk, noting that an SDK is what the linker would use to resolve
      # system libraries. In the current cargo-zigbuild source that probe is
      # gated to macOS hosts, so it can stop appearing on its own. Either way it
      # is a note, not a failure: the link proceeds against Zig's bundled
      # libSystem stub — the SDK-free path we want — and the artifact is a
      # normal Mach-O arm64 binary. The v0.1.0 run built and packaged macOS with
      # this exact warning, and an SDK-less build of the same source (verified
      # locally, with `xcrun` made to fail) runs fine.
      # If a future dependency does link Darwin frameworks, that changes: fetch
      # the SDK and export SDKROOT instead (see rust-cross/cargo-zigbuild's CI).
      #   curl -sqL https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz | tar -Jx -C .
      #   export SDKROOT=$PWD/MacOSX11.3.sdk
      - name: Cross-build macOS aarch64
        run: cargo zigbuild --release --locked --target aarch64-apple-darwin
      - name: Package tar.gz
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/turnpike dist/turnpike
          tar -czf dist/turnpike-aarch64-apple-darwin.tar.gz -C dist turnpike
      # `gh release upload` rather than action-gh-release: the CLI jobs publish
      # to one release concurrently, and this only ever touches this job's own
      # asset (no release metadata read-modify-write to race on).
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/turnpike-aarch64-apple-darwin.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      # Hand the binary to the desktop job as an artifact, under the name the
      # bundle ships it as. Named `turnpike-cli` rather than `turnpike` because
      # on Windows the resource directory is the app's own install directory,
      # where `turnpike.exe` — the app itself — already lives.
      #
      # `upload-artifact` does not preserve the exec bit (everything downloads
      # 0644). That is fine here precisely because this is an install *source*,
      # not a binary run in place: the app copies it out with an explicit 0755.
      - name: Stage the CLI binary for the desktop bundle
        run: |
          mkdir -p cli-bundle
          cp target/aarch64-apple-darwin/release/turnpike cli-bundle/turnpike-cli
      - uses: actions/upload-artifact@v4
        with:
          name: turnpike-cli-aarch64-apple-darwin
          path: cli-bundle/turnpike-cli
          # A pass-through between two jobs in this run, not a deliverable: the
          # release assets are the tarball and the dmg. Don't warehouse it.
          retention-days: 1

  cli-windows:
    name: CLI Windows x86_64
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      # llvm-tools provides llvm-ar, which cargo-xwin shims to llvm-lib. xwin
      # fetches the MSVC CRT/SDK itself but no LLVM: it drives clang-cl and
      # resolves lld-link and llvm-lib by shimming the toolchain's rust-lld and
      # llvm-ar. rust-lld ships with rustc; llvm-ar does not.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - run: rustup target add x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # ring's x86_64 assembly needs neither nasm nor Perl here — a packaged
      # (non-git) ring build links the pre-assembled win64 objects committed
      # under pregenerated/ instead of running the assembler.
      - name: Cross-build Windows x64
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc
      - name: Package zip
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/turnpike.exe dist/turnpike.exe
          (cd dist && zip -9 turnpike-x86_64-pc-windows-msvc.zip turnpike.exe)
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/turnpike-x86_64-pc-windows-msvc.zip --clobber --repo "$GITHUB_REPOSITORY"

      # The same pass-through as the macOS job's, with the Windows extension.
      - name: Stage the CLI binary for the desktop bundle
        run: |
          mkdir -p cli-bundle
          cp target/x86_64-pc-windows-msvc/release/turnpike.exe cli-bundle/turnpike-cli.exe
      - uses: actions/upload-artifact@v4
        with:
          name: turnpike-cli-x86_64-pc-windows-msvc
          path: cli-bundle/turnpike-cli.exe
          retention-days: 1

  cli-sums:
    name: SHA256SUMS
    needs: [cli-macos, cli-windows]
    # Publish the manifest even when a platform failed: whatever did reach the
    # release still has to be installable, since both installers verify against
    # this file. A cancelled run publishes nothing.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Derive the manifest from the release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist && cd dist
          # Hash the assets actually attached to the release, never the local
          # build tree, so the manifest cannot name a file that isn't there.
          # A failing platform leaves no asset, so it leaves no line either.
          gh release download "$TAG" --pattern 'turnpike-*' --clobber --repo "$GITHUB_REPOSITORY" || true
          sha256sum turnpike-* > fresh.txt
          # A manifest from an earlier partial upload may already exist: keep
          # its lines for assets this run did not rebuild, letting the freshly
          # computed line win for any asset in both.
          gh release download "$TAG" --pattern SHA256SUMS -O previous.txt --clobber --repo "$GITHUB_REPOSITORY" || true
          [ -f previous.txt ] || : > previous.txt
          awk '{ lines[$2] = $0 } END { for (a in lines) print lines[a] }' \
            previous.txt fresh.txt | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  desktop-macos:
    name: Desktop macOS aarch64 dmg
    # The matching platform's CLI job, not `cli-sums`: the bundle needs the
    # binary, and waiting on the manifest job would serialize the desktop build
    # behind the other platform's cross-build for no reason.
    needs: [cli-macos]
    runs-on: macos-latest
    # A cold LTO build of the Tauri stack is slow; a hung one should not sit on a
    # macOS runner for hours.
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      # The CLI binary this app ships, straight from the job that built it.
      # `binaries/` is gitignored — it is a build input, not source.
      - uses: actions/download-artifact@v4
        with:
          name: turnpike-cli-aarch64-apple-darwin
          path: desktop/src-tauri/binaries
      # `download-artifact` does not carry the unix exec bit — every file lands
      # 0644 — so the payload would ship non-executable, and `fs::copy` would
      # carry that mode into the installed copy. Restore it here.
      - run: chmod +x desktop/src-tauri/binaries/turnpike-cli
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # The Tauri stack is a large dependency tree and the release profile is
      # `lto = true, codegen-units = 1`, so without a cache a cold build dominates
      # the job.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # `@tauri-apps/cli` is a devDependency, so this is the whole toolchain
      # install — there is no global `cargo install tauri-cli`.
      - name: Install the frontend toolchain
        run: npm ci
        working-directory: desktop

      # Fail here rather than at the end of the build: tauri-bundler only
      # discovers the missing key after it has written the bundles, which is
      # ~15 minutes into this job on a cold runner.
      - name: Check the updater signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. The desktop bundle cannot be built without the updater's minisign key — see docs/desktop.md."
            exit 1
          fi

      # Ad-hoc signing is configured in tauri.conf.json
      # (bundle.macOS.signingIdentity = "-"), deliberately not through
      # APPLE_SIGNING_IDENTITY, so a local `npm run tauri build` and CI sign
      # identically and there is no env-vs-config precedence to reason about.
      # Nothing here notarizes: that needs a paid Apple Developer account.
      #
      # CI is set explicitly. tauri-bundler reads it to decide whether to pass
      # --skip-jenkins to bundle_dmg.sh, which skips the Finder AppleScript — and
      # that AppleScript is what fails on a headless runner (no Automation→Finder
      # grant → -1743 → exit 64, leaving a 30 MB rw.*.dmg behind). GitHub already
      # sets CI=true on every step; this makes the dependency visible rather than
      # silent. Note the cost: --skip-jenkins means no custom dmg background or
      # icon positioning.
      #
      # TAURI_SIGNING_PRIVATE_KEY is the *updater's* minisign key, a different
      # thing from the code signature above: it signs the `.app.tar.gz` an
      # installed app downloads, and that app verifies the download against the
      # pubkey in tauri.conf.json. It cannot live in the repo, so it is a
      # repository secret — and it is required: with `createUpdaterArtifacts` on,
      # tauri-bundler exits 1 when the key is absent ("A public key has been
      # found, but no private key") *after* writing the bundles, so a missing
      # secret costs the artifacts, not merely the signature. Losing the key means
      # existing installs can never be updated again — see docs/desktop.md.
      - name: Bundle the app and dmg
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg
        working-directory: desktop

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: desktop
        run: |
          set -euo pipefail
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          shopt -s nullglob
          dmgs=("$bundle"/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "expected one .dmg under $bundle/dmg, found ${#dmgs[@]}"
            exit 1
          fi
          # A stable name with no version in it, so
          # releases/latest/download/<name> keeps working across releases.
          cp "${dmgs[0]}" turnpike_desktop-aarch64-apple-darwin.dmg
          gh release upload "$TAG" turnpike_desktop-aarch64-apple-darwin.dmg \
            --clobber --repo "$GITHUB_REPOSITORY"

          # The updater's artifact, and not the dmg: an installed app swaps in the
          # .app it unpacks from this tarball, so the dmg is for a human's first
          # install and this is for every update after it. createUpdaterArtifacts
          # puts the minisign `.sig` beside it, signed by
          # TAURI_SIGNING_PRIVATE_KEY; `desktop-sums` reads that file's *content*
          # into latest.json.
          #
          # The signature is not optional at this point: the bundle step cannot
          # succeed without the key, so a missing `.sig` means bundler behaviour
          # changed, not that a secret is unset. Fail with a name rather than let
          # the `cp` below die on a bare "No such file".
          tarballs=("$bundle"/macos/*.app.tar.gz)
          if [ ${#tarballs[@]} -ne 1 ]; then
            echo "expected one .app.tar.gz under $bundle/macos, found ${#tarballs[@]}"
            exit 1
          fi
          if [ ! -f "${tarballs[0]}.sig" ]; then
            echo "no .sig beside ${tarballs[0]} — createUpdaterArtifacts is on, so the build signs the tarball or fails"
            exit 1
          fi
          cp "${tarballs[0]}" turnpike_desktop-aarch64-apple-darwin.app.tar.gz
          gh release upload "$TAG" turnpike_desktop-aarch64-apple-darwin.app.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"
          cp "${tarballs[0]}.sig" turnpike_desktop-aarch64-apple-darwin.app.tar.gz.sig
          gh release upload "$TAG" turnpike_desktop-aarch64-apple-darwin.app.tar.gz.sig \
            --clobber --repo "$GITHUB_REPOSITORY"

  desktop-windows:
    name: Desktop Windows x86_64 installer
    needs: [cli-windows]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: turnpike-cli-x86_64-pc-windows-msvc
          path: desktop/src-tauri/binaries
      # No exec bit on Windows — but `bundled_payload` uses `is_file()` there, and
      # `make_executable` is a no-op, so nothing else is needed. This comment is
      # the record of why the macOS job has a `chmod` step and this one does not.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the frontend toolchain
        run: npm ci
        working-directory: desktop

      # Same check as the macOS job's, and for the same reason.
      - name: Check the updater signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set. The desktop bundle cannot be built without the updater's minisign key — see docs/desktop.md."
            exit 1
          fi

      # No certificate is configured, so Tauri invokes no *code* signing step and
      # the installer ships unsigned; SmartScreen warns on first run. NSIS over
      # msi: one self-contained .exe and no WiX download.
      #
      # TAURI_SIGNING_PRIVATE_KEY is a different signature entirely — the
      # updater's minisign key, over the same .exe an installed app downloads, so
      # that app can verify it against the pubkey in tauri.conf.json. Unsigned by
      # Authenticode and signed by minisign is a coherent pair, not a
      # contradiction.
      - name: Bundle the NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
        working-directory: desktop

      - name: Publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: desktop
        run: |
          set -euo pipefail
          bundle=src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          shopt -s nullglob
          setups=("$bundle"/nsis/*-setup.exe)
          if [ ${#setups[@]} -ne 1 ]; then
            echo "expected one *-setup.exe under $bundle/nsis, found ${#setups[@]}"
            exit 1
          fi
          cp "${setups[0]}" turnpike_desktop-x86_64-pc-windows-msvc-setup.exe
          gh release upload "$TAG" turnpike_desktop-x86_64-pc-windows-msvc-setup.exe \
            --clobber --repo "$GITHUB_REPOSITORY"

          # Windows reuses the NSIS installer as the updater artifact — the
          # updater hands it to the installer and exits — so the `.sig` sits
          # beside the very file just uploaded. Same hard requirement as the
          # macOS job's, for the same reason: the bundle step cannot succeed
          # without the key, so the signature is always here.
          if [ ! -f "${setups[0]}.sig" ]; then
            echo "no .sig beside ${setups[0]} — createUpdaterArtifacts is on, so the build signs the installer or fails"
            exit 1
          fi
          cp "${setups[0]}.sig" turnpike_desktop-x86_64-pc-windows-msvc-setup.exe.sig
          gh release upload "$TAG" turnpike_desktop-x86_64-pc-windows-msvc-setup.exe.sig \
            --clobber --repo "$GITHUB_REPOSITORY"

  desktop-sums:
    name: SHA256SUMS-desktop
    needs: [desktop-macos, desktop-windows]
    # Publish the manifest even when a platform failed: whatever did reach the
    # release still needs a checksum. A cancelled run publishes nothing.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Derive the manifest from the release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist && cd dist
          # Hash the assets actually attached to the release, never the local
          # build tree, so the manifest cannot name a file that isn't there.
          #
          # The desktop prefix is `turnpike_desktop-` with an underscore on
          # purpose: the CLI manifest above globs `turnpike-*`, and
          # `turnpike-desktop-*` would match it, letting the two manifests see
          # each other's assets depending on which finished first. The
          # underscore is load-bearing — `turnpike-*` requires a hyphen.
          gh release download "$TAG" --pattern 'turnpike_desktop-*' --clobber --repo "$GITHUB_REPOSITORY" || true
          sha256sum turnpike_desktop-* > fresh.txt
          # A manifest from an earlier partial upload may already exist: keep its
          # lines for assets this run did not rebuild, letting the freshly
          # computed line win for any asset in both.
          gh release download "$TAG" --pattern SHA256SUMS-desktop -O previous.txt --clobber --repo "$GITHUB_REPOSITORY" || true
          [ -f previous.txt ] || : > previous.txt
          awk '{ lines[$2] = $0 } END { for (a in lines) print lines[a] }' \
            previous.txt fresh.txt | sort -k2 > SHA256SUMS-desktop
          cat SHA256SUMS-desktop
          gh release upload "$TAG" SHA256SUMS-desktop --clobber --repo "$GITHUB_REPOSITORY"

      # The auto-updater's manifest. `plugins.updater.endpoints` points at
      # releases/latest/download/latest.json, so whatever is attached to the
      # newest non-prerelease release is what every installed app polls.
      #
      # Gated on *both* `.sig` files, and not on either one: Tauri deserializes
      # and validates the whole manifest before it compares versions, so a
      # manifest that names one platform fails the parse on the other and
      # disables updates everywhere — worse than publishing nothing, which just
      # leaves the previous release's manifest in place.
      #
      # A signature can only be missing because that platform's job failed: the
      # bundle step exits 1 when the signing key is unset, so an unsigned
      # artifact never reaches the release.
      #
      # The URLs are tag-pinned rather than `releases/latest/download/`, because
      # `latest` is a moving target: an app that checked while this release was
      # current must still be able to fetch *this* release's bundle after a newer
      # one is published.
      - name: Assemble and publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "$TAG" --pattern 'turnpike_desktop-*.sig' --clobber --repo "$GITHUB_REPOSITORY" || true

          darwin=turnpike_desktop-aarch64-apple-darwin.app.tar.gz.sig
          windows=turnpike_desktop-x86_64-pc-windows-msvc-setup.exe.sig
          missing=()
          [ -f "$darwin" ] || missing+=("$darwin")
          [ -f "$windows" ] || missing+=("$windows")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::skipping latest.json — no signature for: ${missing[*]}. That platform's job did not publish one; fix it and re-dispatch this tag to publish an update manifest."
            exit 0
          fi

          # The tag is the version, minus its `v`: tags in this repo are
          # `v0.1.5`, and the updater compares its own Cargo.toml version against
          # a bare semver.
          version="${TAG#v}"
          # RFC 3339, which is what the updater parses.
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          # `--rawfile` (not `--arg`) so the signature's newlines survive as real
          # JSON escapes: the `.sig` is minisign's multi-line format, and the
          # updater verifies the whole file, comment lines included.
          jq -n \
            --arg version "$version" \
            --arg pub_date "$pub_date" \
            --rawfile darwin_sig "$darwin" \
            --rawfile windows_sig "$windows" \
            --arg darwin_url "$base/turnpike_desktop-aarch64-apple-darwin.app.tar.gz" \
            --arg windows_url "$base/turnpike_desktop-x86_64-pc-windows-msvc-setup.exe" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $darwin_sig, url: $darwin_url },
                "windows-x86_64": { signature: $windows_sig, url: $windows_url }
              }
            }' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
