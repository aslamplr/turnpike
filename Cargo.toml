[package]
name = "turnpike"
version = "0.1.13"
edition = "2021"
description = "A minimal local gateway that proxies Claude/Anthropic and OpenAI-spec clients to any OpenAI- or Anthropic-compatible LLM provider, with model remapping and one-command launch integrations for Claude Code and Claude Desktop."
license = "MIT"
# `desktop/` is a separate app with its own workspace and its own node_modules.
# Without this, `cargo package` would sweep both into the crate tarball.
exclude = ["desktop"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http1"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "http2", "charset", "gzip", "deflate", "brotli"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps Map keys in insertion order, not sorted. Without it a
# tool-call's argument object round-trips with different key order than the
# model generated, the replayed history tokenizes differently, and the
# upstream's prefix/KV cache misses from that point on (Ollama fixed the same
# degradation in its translating proxy).
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
home = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"
async-trait = "0.1"
ring = "0.17"
zeroize = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[profile.release]
strip = true
lto = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }
